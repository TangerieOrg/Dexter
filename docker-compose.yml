version: '3'
services:
  redis:
    image: redislabs/redismod:latest
    volumes:
      - redis-data:/data
      - redis-conf:/usr/local/etc/redis/redis.conf
    # ports:
    #   - 6379:6379
    deploy:
      replicas: 1
  api:
    image: ${IMAGE_NAME}/api:latest
    deploy:
      replicas: 1
      labels:
        xyz.tangerie.reverse_proxy.path: "/dexter/api"
        xyz.tangerie.reverse_proxy.port: "80"
    networks:
      - default
      - nginx-proxy-overlay
    # redis is only needed for the one-off import into sqlite, remove it once /health shows the data
    depends_on:
      - redis
    environment:
      - DEXCOM_ENV_FILE=/run/secrets/DexcomAuth
      - DB_PATH=/data/dexter.db
      - REDIS_URL=redis://dexter_redis:6379
    volumes:
      - dexter-data:/data
    secrets:
      - DexcomAuth

  frontend:
    image: ${IMAGE_NAME}/frontend:latest
    deploy:
      replicas: 1
      labels:
        xyz.tangerie.reverse_proxy.path: "/dexter"
        xyz.tangerie.reverse_proxy.port: "80"
    networks:
      - default
      - nginx-proxy-overlay
    depends_on:
      - api

volumes:
  dexter-data:
  redis-data:
  redis-conf:

networks:
  default:
  nginx-proxy-overlay:
    external: true
    driver: overlay

secrets:
  DexcomAuth:
    external: true